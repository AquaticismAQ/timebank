spring:
  application:
    name: timebank-backend

  threads:
    virtual:
      enabled: true # D3 — Spring MVC + virtual threads, no WebFlux

  datasource:
    # No defaults for secrets (Design.md §17.1: "Configuration: Spring profiles;
    # all secrets injected at runtime"). Fails fast if the env is not set rather
    # than silently connecting to nothing.
    url: ${TIMEBANK_DB_URL:?TIMEBANK_DB_URL must be set}
    username: ${TIMEBANK_DB_USERNAME:?TIMEBANK_DB_USERNAME must be set}
    password: ${TIMEBANK_DB_PASSWORD:?TIMEBANK_DB_PASSWORD must be set}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Conservative for the shared test server (3.8 GB RAM total, many other
      # tenants). Design.md §16.4's ~20-30/instance target is for a dedicated
      # production host — do not copy that number here.
      maximum-pool-size: ${TIMEBANK_DB_POOL_SIZE:5}
      pool-name: timebank-hikari

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns schema, always (D7) — never "update".
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  session:
    jdbc:
      initialize-schema: never # Flyway owns this schema too (V2__spring_session.sql, D7)

server:
  port: ${TIMEBANK_SERVER_PORT:8080}
  # Bound to loopback only — Nginx terminates TLS and proxies (Design.md §17.1);
  # the app is never reachable directly from outside the host.
  #
  # Overridable solely so the container image can bind 0.0.0.0 (issue 101):
  # inside a container, loopback means the container's own loopback, so a
  # published port connects to nothing and the symptom is a bare connection
  # refused with a perfectly healthy process behind it. The default is
  # unchanged, so a systemd deployment that sets nothing keeps the property
  # this line exists for; `docker-compose.yml` is the only thing that overrides
  # it, and only because the container boundary already provides the isolation.
  address: ${TIMEBANK_SERVER_ADDRESS:127.0.0.1}
  # Nginx sets X-Forwarded-Proto/-For (B0.11's vhost config) — without this,
  # request.isSecure() reports false behind the proxy and the Secure cookie
  # flag below would silently never be set.
  forward-headers-strategy: native
  tomcat:
    # Contract §2.7's `filter[field]=value`/`page[number]` convention (B0.6)
    # puts literal `[`/`]` in query-parameter *names* — Tomcat's default
    # RFC 3986 query validation rejects those characters outright (a plain
    # 400, before the request even reaches Spring MVC), which went
    # unnoticed until B5.12's `GET /audit-logs` became the first endpoint
    # to actually exercise `filter[...]` over real HTTP.
    relaxed-query-chars: "[,]"
  servlet:
    session:
      cookie:
        name: TIMEBANK_SESSION
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true # liveness + readiness (B0.12) — both needed for load-balancer registration
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    cn.timebank: INFO

timebank:
  environment: ${TIMEBANK_ENVIRONMENT:unspecified}
  security:
    # Contract §2.3. Comma-separated. No default (issue 027: a placeholder
    # default here silently degrades into every real-browser request getting
    # rejected with 403 "Request origin is not allowed" — curl-based checks
    # never notice, since curl doesn't send an Origin header, so this failed
    # silently for real users while looking fine to every script-based
    # verification). Fails fast at startup instead, matching every other
    # required env var above — set via TIMEBANK_ALLOWED_ORIGINS on the
    # server (see the untracked test-server-credits.md).
    allowed-origins: ${TIMEBANK_ALLOWED_ORIGINS:?TIMEBANK_ALLOWED_ORIGINS must be set}
  auth:
    lockout:
      max-failed-attempts: ${TIMEBANK_LOCKOUT_MAX_ATTEMPTS:5}
      duration-minutes: ${TIMEBANK_LOCKOUT_DURATION_MINUTES:15}
    session:
      default-timeout-minutes: ${TIMEBANK_SESSION_DEFAULT_TIMEOUT_MINUTES:480}
    activation:
      # 10-StudentIdentityAndOnboarding.md §2.6. Configurable because the
      # tension belongs to the school: two days is too short (import Monday,
      # print Wednesday, and the window is gone before a student sees the
      # slip), but the expiry is precisely what makes emailing a class's
      # slips tolerable, so it cannot be long either.
      code-ttl-days: ${TIMEBANK_ACTIVATION_CODE_TTL_DAYS:7}
      # §2.5's global failure budget: guesses per hour across the *entire*
      # system, not per IP. This is the control that closes the distributed
      # case — a botnet keeps every individual IP under its own limit while
      # grinding the pool of outstanding codes, and §2.5 is explicit that the
      # per-IP limit "cannot be relied on". Only a well-formed code matching
      # no row is charged; see ActivationThrottle for why the other failure
      # modes deliberately cost nothing. Raising this materially weakens
      # §2.5's sizing table, which assumed a couple of hundred per hour.
      failure-budget-per-hour: ${TIMEBANK_ACTIVATION_FAILURE_BUDGET_PER_HOUR:300}
      # Per-IP attempt ceiling, charged on every attempt including successful
      # ones. Sized against the real burst, not a guessed round number: a
      # class activating together sits behind one school NAT, so ~30 requests
      # arrive from a single address in one lesson. Anything near 20 would
      # cut that off halfway through and look like a broken system. Its job
      # is stopping one host from eating the whole shared budget above, not
      # being the primary defence.
      attempts-per-ip-per-hour: ${TIMEBANK_ACTIVATION_ATTEMPTS_PER_IP_PER_HOUR:60}
      # 10-StudentIdentityAndOnboarding.md §2.9 — the site's *root* URL, both
      # printed on the credential slip and used to build the QR's deep link
      # (`<root>/activate?code=...`). No default, and fails fast at startup for
      # the same reason `allowed-origins` above does, only more so: the printed
      # URL is a phishing anchor, the one thing a child is told to check the
      # address bar against. A placeholder default would print a domain the
      # school does not own onto paper handed to students — a failure no
      # script-based verification would ever notice. Set via
      # TIMEBANK_SITE_ROOT_URL on the server (see the untracked
      # test-server-credits.md). Root, not a deep link: §2.9 rejects printing
      # `.../activate` for typing, since it teaches a URL used exactly once
      # while the login page is used for years.
      site-root-url: ${TIMEBANK_SITE_ROOT_URL:?TIMEBANK_SITE_ROOT_URL must be set}
      expiry-sweep:
        # 10-StudentIdentityAndOnboarding.md §3.6. Hourly at :40 — off the hour,
        # where the grade-summary materialisation already runs. Unlike every
        # other scheduled job here, which hardcodes its cron, this one is
        # configurable for a duller reason than the window above: its right
        # frequency depends on how the school actually works.
        cron: ${TIMEBANK_ACTIVATION_EXPIRY_SWEEP_CRON:0 40 * * * *}
        # Accounts transitioned per run, bounding both the transaction and the
        # single audit row's id list. A larger backlog drains over successive
        # runs, oldest expiry first. A whole school's import lapsing at once is
        # the case this exists for.
        batch-limit: ${TIMEBANK_ACTIVATION_EXPIRY_SWEEP_BATCH_LIMIT:500}
  file:
    # B3.4, test-stage local-disk adapter (14-Backend-B3F-CloudFileStorage.md
    # tracks the move to a real S3-compatible store). Relative to the
    # process working directory (/opt/timebank-backend under systemd) —
    # disk space is not a concern for this pass's volume, per direction.
    storage-path: ${TIMEBANK_FILE_STORAGE_PATH:data/evidence-storage}
    max-size-bytes: ${TIMEBANK_FILE_MAX_SIZE_BYTES:20971520}
    # No default: a download-token signing secret must never be guessable.
    token-secret: ${TIMEBANK_FILE_TOKEN_SECRET:?TIMEBANK_FILE_TOKEN_SECRET must be set}
    pdf:
      # 08-SecurityPrivacyHardening.md §3.7. A cap, not a quality judgement:
      # the per-viewer watermark walks every page on every view, so an
      # absurdly long document is a cheap way to make one request expensive
      # on a 1 vCPU box. Evidence scans are a handful of pages.
      max-pages: ${TIMEBANK_FILE_PDF_MAX_PAGES:100}
