spring:
  application:
    name: timebank-backend

  threads:
    virtual:
      enabled: true # D3 — Spring MVC + virtual threads, no WebFlux

  datasource:
    # No defaults for secrets (Design.md §17.1: "Configuration: Spring profiles;
    # all secrets injected at runtime"). Fails fast if the env is not set rather
    # than silently connecting to nothing.
    url: ${TIMEBANK_DB_URL:?TIMEBANK_DB_URL must be set}
    username: ${TIMEBANK_DB_USERNAME:?TIMEBANK_DB_USERNAME must be set}
    password: ${TIMEBANK_DB_PASSWORD:?TIMEBANK_DB_PASSWORD must be set}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Conservative for the shared test server (3.8 GB RAM total, many other
      # tenants). Design.md §16.4's ~20-30/instance target is for a dedicated
      # production host — do not copy that number here.
      maximum-pool-size: ${TIMEBANK_DB_POOL_SIZE:5}
      pool-name: timebank-hikari

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns schema, always (D7) — never "update".
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  session:
    jdbc:
      initialize-schema: never # Flyway owns this schema too (V2__spring_session.sql, D7)

server:
  port: ${TIMEBANK_SERVER_PORT:8080}
  # Bound to loopback only — Nginx terminates TLS and proxies (Design.md §17.1);
  # the app is never reachable directly from outside the host.
  address: 127.0.0.1
  # Nginx sets X-Forwarded-Proto/-For (B0.11's vhost config) — without this,
  # request.isSecure() reports false behind the proxy and the Secure cookie
  # flag below would silently never be set.
  forward-headers-strategy: native
  tomcat:
    # Contract §2.7's `filter[field]=value`/`page[number]` convention (B0.6)
    # puts literal `[`/`]` in query-parameter *names* — Tomcat's default
    # RFC 3986 query validation rejects those characters outright (a plain
    # 400, before the request even reaches Spring MVC), which went
    # unnoticed until B5.12's `GET /audit-logs` became the first endpoint
    # to actually exercise `filter[...]` over real HTTP.
    relaxed-query-chars: "[,]"
  servlet:
    session:
      cookie:
        name: TIMEBANK_SESSION
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true # liveness + readiness (B0.12) — both needed for load-balancer registration
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    cn.timebank: INFO

timebank:
  environment: ${TIMEBANK_ENVIRONMENT:unspecified}
  security:
    # Contract §2.3. Comma-separated. No default (issue 027: a placeholder
    # default here silently degrades into every real-browser request getting
    # rejected with 403 "Request origin is not allowed" — curl-based checks
    # never notice, since curl doesn't send an Origin header, so this failed
    # silently for real users while looking fine to every script-based
    # verification). Fails fast at startup instead, matching every other
    # required env var above — set via TIMEBANK_ALLOWED_ORIGINS on the
    # server (see the untracked test-server-credits.md).
    allowed-origins: ${TIMEBANK_ALLOWED_ORIGINS:?TIMEBANK_ALLOWED_ORIGINS must be set}
  auth:
    lockout:
      max-failed-attempts: ${TIMEBANK_LOCKOUT_MAX_ATTEMPTS:5}
      duration-minutes: ${TIMEBANK_LOCKOUT_DURATION_MINUTES:15}
    session:
      default-timeout-minutes: ${TIMEBANK_SESSION_DEFAULT_TIMEOUT_MINUTES:480}
  file:
    # B3.4, test-stage local-disk adapter (14-Backend-B3F-CloudFileStorage.md
    # tracks the move to a real S3-compatible store). Relative to the
    # process working directory (/opt/timebank-backend under systemd) —
    # disk space is not a concern for this pass's volume, per direction.
    storage-path: ${TIMEBANK_FILE_STORAGE_PATH:data/evidence-storage}
    max-size-bytes: ${TIMEBANK_FILE_MAX_SIZE_BYTES:20971520}
    # No default: a download-token signing secret must never be guessable.
    token-secret: ${TIMEBANK_FILE_TOKEN_SECRET:?TIMEBANK_FILE_TOKEN_SECRET must be set}
    pdf:
      # 08-SecurityPrivacyHardening.md §3.7. A cap, not a quality judgement:
      # the per-viewer watermark walks every page on every view, so an
      # absurdly long document is a cheap way to make one request expensive
      # on a 1 vCPU box. Evidence scans are a handful of pages.
      max-pages: ${TIMEBANK_FILE_PDF_MAX_PAGES:100}
  activation:
    expiry-sweep:
      # 10-StudentIdentityAndOnboarding.md §3.6. Hourly at :40 — off the hour,
      # where the grade-summary materialisation already runs. §2.6 makes the
      # activation window itself configurable because the tension between
      # "long enough to reach the student" and "short enough that emailing a
      # class's slips is tolerable" belongs to the school; the sweep that
      # notices the window closed is configurable for the duller reason that
      # its right frequency depends on how the school actually works.
      cron: ${TIMEBANK_ACTIVATION_EXPIRY_SWEEP_CRON:0 40 * * * *}
      # Accounts transitioned per run, bounding both the transaction and the
      # single audit row's id list. A larger backlog drains over successive
      # runs, oldest expiry first. A whole school's import lapsing at once is
      # the case this exists for.
      batch-limit: ${TIMEBANK_ACTIVATION_EXPIRY_SWEEP_BATCH_LIMIT:500}
