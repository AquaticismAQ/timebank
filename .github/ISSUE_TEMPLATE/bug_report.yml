name: Bug report
description: Something in the app, backend, or docs isn't working as expected
title: "[Bug]: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check [existing issues](../issues) and, if this might already be a known/fixed live-verified defect, `Docs/issues/` in the repo.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend (Student Portal)
        - Frontend (Admin/Teacher Portal)
        - Backend / API
        - Documentation
        - Design (Design/chinese)
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g. Chrome 128 / macOS, or backend commit hash"
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
