name: Documentation issue · 文档问题
description: A mistake, gap, or Chinese/English mismatch in the docs · 文档有误、缺失或中英文不一致
title: "[Docs]: "
labels: ["type: documentation", "status: needs-triage"]
body:
  - type: input
    id: location
    attributes:
      label: Which document? · 哪个文档？
      description: File name or link, and the section if you know it · 文件名或链接，知道的话写上章节
      placeholder: "e.g. Design/english/10-StudentActivationFlow.md §3"
    validations:
      required: true
  - type: dropdown
    id: issuetype
    attributes:
      label: What kind of problem? · 什么类型的问题？
      options:
        - Something is wrong · 内容有误
        - Something is unclear or missing · 不清楚或有缺漏
        - Chinese and English versions don't match · 中英文版本不一致
        - Broken link · 链接失效
        - Other · 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What's the problem? · 具体是什么问题？
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: How would you fix it? (optional) · 建议怎么改？（可选）
    validations:
      required: false
