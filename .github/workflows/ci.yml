name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # There's no separate `pnpm typecheck` script (see CLAUDE.md) — this
      # is the same explicit tsc command frontend/scripts/deploy.sh runs,
      # since Vite's esbuild transform strips types without checking them.
      - name: Type-check
        run: npx -y -p typescript tsc --noEmit -p tsconfig.json

      - name: Build
        run: pnpm build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compile
        run: mvn -B -ntp compile

      # `mvn test` only: MockMvc slices + ArchUnit, no external dependency.
      # `mvn verify` (adds *IT integration tests) needs TIMEBANK_DB_HOST/
      # _USERNAME/_PASSWORD against the shared test server and is
      # intentionally not run here — see CLAUDE.md and backend/scripts/verify.sh.
      - name: Unit tests
        run: mvn -B -ntp test
