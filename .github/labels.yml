# Source of truth for repo labels, synced by .github/workflows/labels.yml
# (EndBug/label-sync). Edit here, not in the GitHub UI — UI edits get
# overwritten on the next push to main. See .github/LABELS.md for the policy.

# ── Type (exactly one per issue/PR) ─────────────────────────────────────
- name: "type: fix"
  color: "d73a4a"
  description: Something isn't working
  aliases: ["type: bug"]
- name: "type: feat"
  color: "a2eeef"
  description: New feature or improvement request
  aliases: ["type: enhancement"]
- name: "type: documentation"
  color: "0075ca"
  description: Design/Docs content — errors, gaps, translation sync
- name: "type: question"
  color: "d876e3"
  description: Further information is requested
- name: "type: chore"
  color: "fef2c0"
  description: Tooling, dependencies, repo maintenance
- name: "type: refactor"
  color: "c5def5"
  description: Code change with no behavior change
- name: "type: test"
  color: "bfe5bf"
  description: Test-only change, no production behavior change
- name: "type: security"
  color: "b60205"
  description: Security-relevant issue

# ── Status (lifecycle, one at a time) ───────────────────────────────────
- name: "status: needs-triage"
  color: "ededed"
  description: Not yet reviewed by a maintainer
- name: "status: confirmed"
  color: "0e8a16"
  description: Reproduced/agreed and ready to work on
- name: "status: in-progress"
  color: "fbca04"
  description: Actively being worked on
- name: "status: blocked"
  color: "e99695"
  description: Waiting on something external (infra, decision, dependency)
- name: "status: wontfix"
  color: "ffffff"
  description: Valid but intentionally not being addressed
- name: "status: duplicate"
  color: "cfd3d7"
  description: Already reported elsewhere

# ── Priority (optional) ─────────────────────────────────────────────────
- name: "priority: high"
  color: "b60205"
  description: Should be addressed soon
- name: "priority: medium"
  color: "fbca04"
  description: Normal priority
- name: "priority: low"
  color: "c2e0c6"
  description: Nice to have, no urgency

# ── Area (optional, can combine) ────────────────────────────────────────
- name: "area: frontend"
  color: "1d76db"
  description: frontend/ (React/Vite)
- name: "area: backend"
  color: "5319e7"
  description: backend/ (Spring Boot/Java)
- name: "area: docs"
  color: "0075ca"
  description: Design/ or Docs/
- name: "area: design"
  color: "f9d0c4"
  description: Institutional/UX design, not code
- name: "area: ci"
  color: "bfd4f2"
  description: .github/, build/deploy scripts

# ── Phase (optional, matches CLAUDE.md's phase model) ───────────────────
- name: "phase: 2-online-system"
  color: "c2e0c6"
  description: Phase 2 — the online system (current focus)
- name: "phase: 3-pov"
  color: "e4e669"
  description: Phase 3 — Proof of Volunteering (reserved, not implemented)
- name: "phase: 4-redemption"
  color: "e4e669"
  description: Phase 4 — redemption/borrowing/value-added (reserved, not implemented)

# ── Community ────────────────────────────────────────────────────────────
- name: "good first issue"
  color: "7057ff"
  description: Good for newcomers
- name: "help wanted"
  color: "008672"
  description: Extra attention welcome
- name: "invalid"
  color: "e4e669"
  description: Not a real issue (can't reproduce, not applicable, etc.)
